name: Lab
# lab/ branch only: pictures of the sheet mock (test/sheetcap), on an x64 runner with Chrome.
on:
  push:
    branches: ['lab/**']
jobs:
  sheet:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Draw the sheet
        run: |
          npx vite --port 8123 --strictPort --host 127.0.0.1 > vite.log 2>&1 &
          for i in $(seq 1 120); do curl -sf http://127.0.0.1:8123/next.html > /dev/null && break; sleep 1; done
          node test/sheetcap/run.mjs http://127.0.0.1:8123/ out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sheet
          path: |
            out
            vite.log
          retention-days: 7
