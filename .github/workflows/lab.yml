name: Lab
# lab/ branch only: Full Time in the real app (test/ftlive), three matches simmed to the whistle on an x64 runner with Chrome.
# The registry is blocked, so nothing reaches the server.
on:
  push:
    branches: ['lab/**']
jobs:
  fulltime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Full Time
        run: |
          npx vite --port 8123 --strictPort --host 127.0.0.1 > vite.log 2>&1 &
          for i in $(seq 1 120); do curl -sf http://127.0.0.1:8123/ > /dev/null && break; sleep 1; done
          node test/ftlive/run.mjs http://127.0.0.1:8123/ out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fulltime
          path: |
            out
            vite.log
          retention-days: 7
