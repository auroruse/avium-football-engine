name: Lab
# lab/ branch only: the pitch-name check (test/lineup), on an x64 runner with Chrome.
on:
  push:
    branches: ['lab/**']
jobs:
  pitch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Draw and measure
        run: |
          npx vite --port 8123 --strictPort --host 127.0.0.1 > vite.log 2>&1 &
          for i in $(seq 1 120); do curl -sf http://127.0.0.1:8123/test/lineup/index.html > /dev/null && break; sleep 1; done
          google-chrome --version
          node test/lineup/run.mjs http://127.0.0.1:8123/ out 0,459,4-1-2-1-2 0,459,3-5-2 0,380,4-1-2-1-2 1,549,4-1-2-1-2 1,669,4-1-2-1-2 1,669,5-3-2 1,549,4-2-3-1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pitch
          path: |
            out
            vite.log
          retention-days: 7
