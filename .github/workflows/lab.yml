name: Lab

# lab/fields: every Field in New Tournament's Preset menu, loaded and played out in the built app, one runner each.
on:
  push:
    branches: ['lab/**']

jobs:
  field:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        field: ["All-Nichirin Collegiate Championship"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npx vite build
      - name: Play ${{ matrix.field }}
        run: |
          mkdir -p out
          (npx vite preview --port 4599 > out/preview.log 2>&1 &)
          for i in $(seq 1 60); do curl -s localhost:4599 > /dev/null && break; sleep 1; done
          FIELD="${{ matrix.field }}" timeout 2400 node test/fields-ui.mjs > out/field.json
          cat out/field.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: field-${{ strategy.job-index }}
          path: out/field.json
          retention-days: 7
